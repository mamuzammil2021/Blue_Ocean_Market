<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blue Ocean Market OS</title><style>
:root{--bg:#f4f7fb;--panel:#fff;--ink:#162033;--muted:#6b778c;--line:#e5eaf1;--brand:#0b63ce;--brand2:#1646a0;--good:#0b8f55;--warn:#c57b00;--bad:#c23838;--shadow:0 12px 35px rgba(20,40,80,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top left,#dcecff,transparent 45%),linear-gradient(135deg,#f6f9ff,#eef4fb)}.login-card{width:min(430px,92vw);background:#fff;border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:var(--shadow)}.brand{font-weight:800;font-size:22px}.brand span{color:var(--brand)}.login h1{margin:28px 0 6px;font-size:30px}.sub{color:var(--muted);font-size:14px}.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}.field label{font-size:12px;font-weight:700;color:#526074}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;outline:none}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#8db9ee;box-shadow:0 0 0 3px #e8f2ff}.btn{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:10px;color:var(--ink)}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.danger{color:#fff;background:var(--bad);border-color:var(--bad)}.btn.small{padding:6px 9px;font-size:12px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#0f1c33;color:#dce6f6;padding:18px;position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}.side .brand{padding:10px 8px 24px}.side .brand span{color:#63a4ff}.nav{display:flex;flex-direction:column;gap:4px;min-height:0}.nav button{background:transparent;color:#aebbd0;border:0;text-align:left;padding:11px 12px;border-radius:10px}.nav button:hover,.nav button.active{background:#1b2d4d;color:#fff}.main{min-width:0}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:10}.top-right{display:flex;gap:10px;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;background:#e8f2ff;color:var(--brand);display:grid;place-items:center;font-weight:800}.content{padding:24px;max-width:1600px;margin:auto}.titlebar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.titlebar h1{margin:0;font-size:27px}.muted{color:var(--muted)}.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 18px rgba(20,40,80,.035);padding:18px}.stat .label{font-size:12px;color:var(--muted);font-weight:700}.stat .value{font-size:26px;font-weight:800;margin-top:8px}.stat .hint{font-size:12px;margin-top:4px;color:var(--muted)}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-title h3{margin:0;font-size:16px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#eef3f8}.pill.good{background:#e5f8ef;color:var(--good)}.pill.warn{background:#fff3db;color:var(--warn)}.pill.bad{background:#ffe9e9;color:var(--bad)}.pill.blue{background:#e7f1ff;color:var(--brand)}.chart{height:250px}.bars{display:flex;align-items:end;gap:8px;height:210px;padding:10px 5px}.bar{flex:1;background:linear-gradient(#4e94eb,#0b63ce);border-radius:7px 7px 2px 2px;min-width:10px;position:relative}.bar span{position:absolute;bottom:-20px;font-size:9px;color:var(--muted);left:50%;transform:translateX(-50%)}.bar em{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted);font-style:normal}.modal-bg{position:fixed;inset:0;background:rgba(15,28,51,.45);display:grid;place-items:center;padding:20px;z-index:50}.modal{width:min(820px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.25)}.modal h2{margin:0 0 4px}.toast{position:fixed;right:22px;bottom:22px;background:#10213b;color:#fff;padding:12px 16px;border-radius:12px;z-index:100;box-shadow:var(--shadow)}.notif{padding:10px 0;border-bottom:1px solid var(--line)}.notif-panel{position:fixed;right:22px;top:65px;width:min(400px,92vw);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);z-index:30;padding:15px}.mobile-menu{display:none}.kpi-meter{height:9px;background:#edf1f5;border-radius:10px;overflow:hidden}.kpi-meter i{display:block;height:100%;background:var(--brand)}.pos-layout{display:grid;grid-template-columns:1.4fr .8fr;gap:16px}.menu-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.menu-item{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.menu-item:hover{border-color:#9fc4f2;box-shadow:0 6px 20px rgba(20,60,120,.08)}.cart-row{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.room{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.table-tile{padding:15px;border-radius:12px;border:1px solid var(--line);background:#fff}.table-tile.busy{border-color:#ffbf55;background:#fff8e8}.search{max-width:280px}.mobile-only{display:none}@media(max-width:1100px){.shell{grid-template-columns:78px 1fr}.side .brand{font-size:0}.side .brand:after{content:'BO';font-size:20px}.nav button{font-size:0;text-align:center}.nav button:before{content:'•';font-size:22px}.g4{grid-template-columns:repeat(2,1fr)}.pos-layout{grid-template-columns:1fr}.menu-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.shell{display:block}.side{height:auto;position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;padding:7px 8px}.side .brand{display:none}.nav{flex-direction:row;justify-content:flex-start;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:thin}.nav button{padding:10px;font-size:10px}.nav button:before{display:none}.top{padding:0 12px}.content{padding:14px 12px 90px}.g2,.g3,.g4{grid-template-columns:1fr}.mobile-menu{display:block}.room{grid-template-columns:repeat(2,1fr)}.menu-grid{grid-template-columns:1fr}.top .role{display:none}}
</style></head><body><div id="root"></div><div id="modalRoot"></div><div id="toastRoot"></div><script>
const root=document.getElementById('root');let token=localStorage.getItem('bo_token'),me=null,view='dashboard';
const roles=['CEO / Owner','Operations Manager','Finance / Admin','Sales / Business Development','Business Unit Manager','Staff Member'];
const nav=[['dashboard','Dashboard'],['businesses','Business Units'],['sales','Sales'],['purchases','Purchases'],['inventory','Inventory'],['finance','Finance'],['approvals','Approvals'],['tasks','Tasks'],['crm','CRM'],['reports','Daily Reports'],['kpi','KPIs'],['documents','Documents'],['meetings','Meetings'],['restaurant','MIMI POS'],['users','Users'],['audit','Audit']];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function money(v){return Number(v||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});}
async function api(url,opt={}){opt.headers=opt.headers||{};if(token)opt.headers.Authorization='Bearer '+token;const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Request failed');return d;}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.getElementById('toastRoot').appendChild(e);setTimeout(()=>e.remove(),2800)}
function modal(html){document.getElementById('modalRoot').innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">'+html+'</div></div>'}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function allowed(key){if(!me)return false;if(me.role==='CEO / Owner')return true;const map={dashboard:1,businesses:['Operations Manager'],sales:['Operations Manager','Finance / Admin','Sales / Business Development','Business Unit Manager'],purchases:['Operations Manager','Finance / Admin','Business Unit Manager'],inventory:['Operations Manager','Finance / Admin','Business Unit Manager','Staff Member'],finance:['Operations Manager','Finance / Admin','Business Unit Manager'],approvals:['Operations Manager','Finance / Admin','Business Unit Manager'],tasks:['Operations Manager','Sales / Business Development','Business Unit Manager','Staff Member'],crm:['Operations Manager','Sales / Business Development','Business Unit Manager'],reports:['Operations Manager','Finance / Admin','Business Unit Manager','Staff Member'],kpi:['Operations Manager','Sales / Business Development','Business Unit Manager'],documents:['Operations Manager','Finance / Admin','Sales / Business Development','Business Unit Manager','Staff Member'],meetings:['Operations Manager','Business Unit Manager'],restaurant:['Operations Manager','Business Unit Manager'],users:['Operations Manager'],audit:['Operations Manager']};return map[key]===1||map[key]?.includes(me.role)}
function login(){root.innerHTML=`<div class="login"><div class="login-card"><div class="brand">BLUE OCEAN <span>MARKET</span></div><h1>Management OS</h1><p class="sub">Company-wide operations, finance, inventory, sales and restaurant control.</p><form onsubmit="doLogin(event)"><div class="field"><label>Email</label><input name="email" type="email" value="admin@blueocean.local" required></div><div class="field"><label>Password</label><input name="password" type="password" value="Admin@123" required></div><button class="btn primary" style="width:100%;padding:12px">Sign in</button></form><button class="btn" style="width:100%;margin-top:10px" onclick="forgot()">Forgot password?</button><p class="sub" style="margin-top:14px">Demo administrator: admin@blueocean.local / Admin@123</p></div></div>`}
async function doLogin(e){e.preventDefault();try{const d=await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});token=d.token;me=d.user;localStorage.setItem('bo_token',token);render();}catch(x){toast(x.message)}}
function forgot(){modal(`<h2>Reset password</h2><p class="muted">Enter the account email. In this self-contained build the reset URL is returned directly for testing; connect SMTP for production email delivery.</p><form onsubmit="doForgot(event)"><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Create reset link</button></div></form>`)}
async function doForgot(e){e.preventDefault();try{const d=await api('/api/auth/forgot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});modal(`<h2>Reset link</h2><p class="muted">For local testing, open this link:</p><input value="${esc(d.reset_url||'No reset URL returned')}" style="width:100%;padding:10px"><div class="actions"><button class="btn primary" onclick="closeModal()">Done</button></div>`)}catch(x){toast(x.message)}}
function render(){root.innerHTML=`<div class="shell"><aside class="side"><div class="brand">BLUE OCEAN <span>MARKET</span></div><nav class="nav">${nav.filter(x=>allowed(x[0])).map(x=>`<button class="${view===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</nav></aside><main class="main"><header class="top"><div><b>${me.name}</b><span class="muted role"> · ${me.role}${me.business_unit_id?' · Unit assigned':''}</span></div><div class="top-right"><button class="btn" onclick="toggleNotifs()">🔔</button><div class="avatar">${esc(me.name.slice(0,1).toUpperCase())}</div><button class="btn" onclick="logout()">Logout</button></div></header><section class="content" id="content"></section></main></div>`;loadView()}
function go(v){view=v;render()}
function logout(){localStorage.removeItem('bo_token');token=null;me=null;login()}
async function boot(){if(!token)return login();try{me=(await api('/api/me')).user;render()}catch(e){logout()}}
async function loadView(){const c=document.getElementById('content');c.innerHTML='<div class="card">Loading…</div>';try{if(view==='dashboard')return dashboard(c);if(view==='businesses')return businesses(c);if(view==='sales')return sales(c);if(view==='purchases')return purchases(c);if(view==='inventory')return inventory(c);if(view==='finance')return finance(c);if(view==='approvals')return approvals(c);if(view==='tasks')return tasks(c);if(view==='crm')return crm(c);if(view==='reports')return reports(c);if(view==='kpi')return kpis(c);if(view==='documents')return documents(c);if(view==='meetings')return meetings(c);if(view==='restaurant')return restaurant(c);if(view==='users')return users(c);if(view==='audit')return auditView(c)}catch(e){c.innerHTML='<div class="card"><b>Error</b><p class="muted">'+esc(e.message)+'</p></div>'}}
function title(t,s,btn=''){return `<div class="titlebar"><div><h1>${t}</h1><div class="muted">${s||''}</div></div>${btn}</div>`}
async function dashboard(c){const d=await api('/api/dashboard'),ts=await api('/api/dashboard/timeseries');c.innerHTML=title('CEO Command Center','Consolidated performance, exceptions and business-unit visibility')+`<div class="grid g4"><div class="card stat"><div class="label">Revenue</div><div class="value">${money(d.revenue)}</div><div class="hint">Finance recorded</div></div><div class="card stat"><div class="label">Expenses</div><div class="value">${money(d.expenses)}</div><div class="hint">All visible units</div></div><div class="card stat"><div class="label">Net</div><div class="value">${money(d.net)}</div><div class="hint">Revenue minus expenses</div></div><div class="card stat"><div class="label">Sales gross profit</div><div class="value">${money(d.gross_profit)}</div><div class="hint">Sales less item cost</div></div></div><div class="grid g3" style="margin-top:16px"><div class="card"><div class="section-title"><h3>30-day sales</h3></div><div class="chart"><div class="bars">${ts.length?ts.map(x=>`<div class="bar" style="height:${Math.max(5,Math.min(100,(x.sales/Math.max(...ts.map(y=>y.sales),1))*100))}%"><em>${Math.round(x.sales/1000)}k</em><span>${x.d.slice(5)}</span></div>`).join(''):'<span class="muted">No sales yet</span>'}</div></div></div><div class="card"><div class="section-title"><h3>Exceptions</h3></div><div class="grid g2"><div><div class="muted">Pending approvals</div><b style="font-size:25px">${d.pending}</b></div><div><div class="muted">Overdue tasks</div><b style="font-size:25px">${d.overdue}</b></div><div><div class="muted">Low stock</div><b style="font-size:25px">${d.low}</b></div><div><div class="muted">Unread alerts</div><b style="font-size:25px">${d.unread}</b></div></div></div><div class="card"><div class="section-title"><h3>Business units</h3></div><div style="display:grid;gap:9px">${d.units.map(u=>`<div style="display:flex;justify-content:space-between;gap:10px"><span>${esc(u.name)}</span><b>${money(u.gross_profit)}</b></div>`).join('')}</div></div></div><div class="card" style="margin-top:16px"><div class="section-title"><h3>Unit performance</h3><button class="btn small" onclick="go('businesses')">Manage units</button></div><div class="table-wrap"><table class="table"><tr><th>Business</th><th>Sales</th><th>Gross profit</th><th>Expenses</th><th>Inventory</th><th>Status</th></tr>${d.units.map(u=>`<tr><td>${esc(u.name)}</td><td>${money(u.sales)}</td><td>${money(u.gross_profit)}</td><td>${money(u.expenses)}</td><td>${money(u.inventory_value)}</td><td><span class="pill ${u.status==='Active'?'good':'warn'}">${u.status}</span></td></tr>`).join('')}</table></div></div>`}
async function businesses(c){const b=await api('/api/business-units'),p=await api('/api/pnl');c.innerHTML=title('Business Units','Separate workspaces with consolidated management reporting',allowed('businesses')?'<button class="btn primary" onclick="businessForm()">+ Add business</button>':'')+`<div class="grid g3">${b.map(x=>{const z=p.find(y=>y.id===x.id)||{};return `<div class="card"><div class="section-title"><h3>${esc(x.name)}</h3><span class="pill ${x.status==='Active'?'good':'warn'}">${x.status}</span></div><div class="muted">Manager: ${esc(x.manager_name||'Unassigned')}</div><div class="grid g2" style="margin-top:14px"><div><small>Sales</small><b>${money(z.sales)}</b></div><div><small>Net profit</small><b>${money(z.net_profit)}</b></div><div><small>Gross profit</small><b>${money(z.gross_profit)}</b></div><div><small>Expenses</small><b>${money(z.operating_expense)}</b></div></div><div class="actions" style="margin-top:14px"><button class="btn small" onclick="editBusiness(${x.id})">Edit</button> <button class="btn small danger" onclick="deleteBusiness(${x.id})">Delete</button></div></div>`}).join('')}</div>`}
async function businessForm(id){const b=id?await api('/api/business-units/'+id):null;const users=await api('/api/users');modal(`<h2>${id?'Manage':'Add'} business unit</h2><form onsubmit="saveBusiness(event,${id||0})"><div class="field"><label>Name</label><input name="name" value="${esc(b?.name||'')}" required></div><div class="grid g2"><div class="field"><label>Manager</label><select name="manager_id"><option value="">Unassigned</option>${users.map(u=>`<option value="${u.id}" ${b?.manager_id==u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div><div class="field"><label>Status</label><select name="status"><option ${b?.status==='Active'?'selected':''}>Active</option><option ${b?.status==='Paused'?'selected':''}>Paused</option><option ${b?.status==='Closed'?'selected':''}>Closed</option></select></div></div><div class="field"><label>Notes</label><textarea name="notes">${esc(b?.notes||'')}</textarea></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save</button></div></form>`)}
async function editBusiness(id){businessForm(id)}
async function saveBusiness(e,id){e.preventDefault();const o=Object.fromEntries(new FormData(e.target));try{await api(id?'/api/business-units/'+id:'/api/business-units',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});closeModal();toast('Business saved');loadView()}catch(x){toast(x.message)}}
async function deleteBusiness(id){if(!confirm('Delete this business unit? Historical units cannot be deleted; close them instead.'))return;try{await api('/api/business-units/'+id,{method:'DELETE'});toast('Business deleted');loadView()}catch(x){toast(x.message)}}
async function sales(c){const rows=await api('/api/sales');c.innerHTML=title('Sales','Product and service sales with cost, gross profit and receipts','<button class="btn primary" onclick="saleForm()">+ New Sale</button>')+`<div class="card"><div class="table-wrap"><table class="table"><tr><th>Invoice</th><th>Business</th><th>Customer</th><th>Type</th><th>Total</th><th>Cost</th><th>Gross profit</th><th>Payment</th><th>Date</th><th>Actions</th></tr>${rows.map(x=>`<tr><td><b>${esc(x.invoice_no)}</b></td><td>${esc(x.business_unit)}</td><td>${esc(x.customer_name||'Walk-in')}</td><td>${esc(x.order_type)}</td><td>${money(x.total)}</td><td>${money(x.cost_total)}</td><td><span class="pill ${x.gross_profit>=0?'good':'bad'}">${money(x.gross_profit)}</span></td><td>${esc(x.payment_method)}</td><td>${x.created_at}</td><td><button class="btn small" onclick="printReceipt(${x.id})">🧾 Print</button> <button class="btn small danger" onclick="voidSale(${x.id})">Void</button></td></tr>`).join('')}</table></div></div>`}
async function voidSale(id){if(!confirm('Void this sale? It will remain in history.'))return;try{await api('/api/sales/'+id+'/void',{method:'PUT'});toast('Sale voided');loadView()}catch(x){toast(x.message)}}
async function saleForm(){const [u,p]=await Promise.all([api('/api/business-units'),api('/api/products')]);let items=[];modal(`<h2>New product / service sale</h2><form onsubmit="saveSale(event)"><div class="grid g2"><div class="field"><label>Business unit</label><select id="saleUnit" name="business_unit_id" onchange="filterSaleProducts()" required>${u.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Payment method</label><select name="payment_method"><option>Cash</option><option>Card</option><option>Bank</option><option>Credit</option><option>Other</option></select></div></div><div class="grid g2"><div class="field"><label>Customer</label><input name="customer_name" placeholder="Walk-in / customer"></div><div class="field"><label>Discount</label><input name="discount" type="number" step="0.01" value="0"></div></div><div class="field"><label>Add item</label><select id="saleProduct" onchange="addSaleItem(this.value)"><option value="">Select product/service</option>${p.map(x=>`<option data-unit="${x.business_unit_id}" value="${x.id}">${esc(x.name)} — ${esc(x.business_unit)} — ${money(x.selling_price)}</option>`).join('')}</select></div><div id="saleItems" class="card" style="background:#fafcff"></div><input type="hidden" name="items" id="saleItemsInput"><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Complete sale</button></div></form>`);window._saleProducts=p;window._saleItems=items;drawSaleItems()}
function filterSaleProducts(){const id=document.getElementById('saleUnit').value;document.querySelectorAll('#saleProduct option[data-unit]').forEach(o=>o.hidden=o.dataset.unit!==id)}
function addSaleItem(id){if(!id)return;const p=window._saleProducts.find(x=>x.id==id);let x=window._saleItems.find(x=>x.product_id==id);if(x)x.quantity++;else window._saleItems.push({product_id:p.id,name:p.name,quantity:1,unit_price:p.selling_price});drawSaleItems();document.getElementById('saleProduct').value=''}
function drawSaleItems(){const el=document.getElementById('saleItems');if(!el)return;el.innerHTML=window._saleItems.length?window._saleItems.map((x,i)=>`<div class="cart-row"><span>${esc(x.name)}</span><span><input style="width:70px" type="number" min="1" value="${x.quantity}" onchange="window._saleItems[${i}].quantity=Number(this.value)"> × ${money(x.unit_price)} <button type="button" class="btn small" onclick="window._saleItems.splice(${i},1);drawSaleItems()">×</button></span></div>`).join(''):'<span class="muted">No items added.</span>'}
async function saveSale(e){e.preventDefault();const f=new FormData(e.target),o=Object.fromEntries(f);o.items=window._saleItems;if(!o.items.length)return toast('Add at least one item');delete o.itemsInput;try{const d=await api('/api/sales',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});closeModal();toast(`Sale ${d.invoice} completed · Profit ${money(d.gross_profit)}`);loadView();printReceipt(d.id)}catch(x){toast(x.message)}}
async function purchases(c){const rows=await api('/api/purchases');c.innerHTML=title('Purchases','Buy stock/services by business unit; costs flow into finance and inventory','<button class="btn primary" onclick="purchaseForm()">+ New Purchase</button>')+`<div class="card"><div class="table-wrap"><table class="table"><tr><th>Purchase</th><th>Business</th><th>Supplier</th><th>Total</th><th>Payment</th><th>Status</th><th>Date</th><th>Actions</th></tr>${rows.map(x=>`<tr><td>${esc(x.purchase_no)}</td><td>${esc(x.business_unit)}</td><td>${esc(x.supplier_name)}</td><td>${money(x.total)}</td><td>${esc(x.payment_method)}</td><td>${esc(x.status)}</td><td>${x.created_at}</td><td><button class="btn small" onclick="purchaseEdit(${x.id})">Edit</button> <button class="btn small danger" onclick="voidPurchase(${x.id})">Void</button></td></tr>`).join('')}</table></div></div>`}
async function purchaseForm(){const [u,p]=await Promise.all([api('/api/business-units'),api('/api/products')]);modal(`<h2>New purchase</h2><form onsubmit="savePurchase(event)"><div class="grid g2"><div class="field"><label>Business</label><select name="business_unit_id" id="purUnit" required>${u.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Supplier</label><input name="supplier_name"></div></div><div class="field"><label>Items</label><select id="purProduct" onchange="addPurItem(this.value)"><option value="">Select product</option>${p.filter(x=>x.item_type==='PRODUCT').map(x=>`<option value="${x.id}">${esc(x.name)} — ${esc(x.business_unit)}</option>`).join('')}</select></div><div id="purItems" class="card"></div><div class="grid g2"><div class="field"><label>Payment</label><select name="payment_method"><option>Cash</option><option>Card</option><option>Bank</option><option>Credit</option></select></div><div class="field"><label>Attachment</label><input name="attachment" type="file"></div></div><div class="field"><label>Notes</label><textarea name="notes"></textarea></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Receive purchase</button></div></form>`);window._purProducts=p;window._purItems=[];drawPurItems()}
function addPurItem(id){if(!id)return;const p=window._purProducts.find(x=>x.id==id);let x=window._purItems.find(x=>x.product_id==id);if(x)x.quantity++;else window._purItems.push({product_id:p.id,name:p.name,quantity:1,unit_cost:p.cost_price});drawPurItems()}
function drawPurItems(){const e=document.getElementById('purItems');if(!e)return;e.innerHTML=window._purItems.length?window._purItems.map((x,i)=>`<div class="cart-row"><span>${esc(x.name)}</span><span><input style="width:65px" type="number" min="1" value="${x.quantity}" onchange="window._purItems[${i}].quantity=Number(this.value)"> × <input style="width:100px" type="number" value="${x.unit_cost}" onchange="window._purItems[${i}].unit_cost=Number(this.value)"> <button type="button" class="btn small" onclick="window._purItems.splice(${i},1);drawPurItems()">×</button></span></div>`).join(''):'<span class="muted">No items.</span>'}
async function savePurchase(e){e.preventDefault();if(!window._purItems.length)return toast('Add at least one product');const fd=new FormData(e.target);fd.set('items',JSON.stringify(window._purItems));try{await api('/api/purchases',{method:'POST',body:fd});closeModal();toast('Purchase received; stock and finance updated');loadView()}catch(x){toast(x.message)}}
async function inventory(c){const [p,m]=await Promise.all([api('/api/products'),api('/api/inventory/movements')]);c.innerHTML=title('Inventory','Opening, incoming, outgoing, adjustments, damaged/waste stock and reorder control',allowed('inventory')?'<button class="btn primary" onclick="productForm()">+ Add product/service</button>':'')+`<div class="grid g4">${p.reduce((a,x)=>a+[x],[]).slice(0,4).map(x=>`<div class="card stat"><div class="label">${esc(x.name)}</div><div class="value">${money(x.current_stock)}</div><div class="hint">${esc(x.unit)} · ${x.current_stock<=x.reorder_level?'Low stock':'In stock'}</div></div>`).join('')}</div><div class="card" style="margin-top:16px"><div class="section-title"><h3>Stock master</h3></div><div class="table-wrap"><table class="table"><tr><th>Business</th><th>SKU</th><th>Item</th><th>Type</th><th>Stock</th><th>Reorder</th><th>Cost</th><th>Sell</th><th>Margin</th><th>Action</th></tr>${p.map(x=>`<tr><td>${esc(x.business_unit)}</td><td>${esc(x.sku)}</td><td>${esc(x.name)}</td><td><span class="pill blue">${x.item_type}</span></td><td><b>${money(x.current_stock)}</b></td><td>${money(x.reorder_level)}</td><td>${money(x.cost_price)}</td><td>${money(x.selling_price)}</td><td>${x.item_type==='SERVICE'?'—':money(x.selling_price-x.cost_price)}</td><td>${allowed('inventory')?`<button class="btn small" onclick="productForm(${x.id})">Edit</button> <button class="btn small" onclick="moveStock(${x.id},'ADD')">Add</button> <button class="btn small" onclick="moveStock(${x.id},'REMOVE')">Remove</button> <button class="btn small danger" onclick="deleteProduct(${x.id})">Remove item</button>`:''}</td></tr>`).join('')}</table></div></div><div class="card" style="margin-top:16px"><div class="section-title"><h3>Recent movements</h3></div><div class="table-wrap"><table class="table"><tr><th>Date</th><th>Business</th><th>Item</th><th>Type</th><th>Qty</th><th>Reason</th><th>User</th></tr>${m.map(x=>`<tr><td>${x.created_at}</td><td>${esc(x.business_unit)}</td><td>${esc(x.product)}</td><td>${esc(x.type)}</td><td>${money(x.quantity)}</td><td>${esc(x.reason)}</td><td>${esc(x.user_name||'')}</td></tr>`).join('')}</table></div></div>`}
async function productForm(id){const [u,p]=await Promise.all([api('/api/business-units'),id?api('/api/products'):Promise.resolve([])]);const x=id?p.find(z=>z.id==id):null;modal(`<h2>${id?'Edit':'Add'} product / service</h2><form onsubmit="saveProduct(event,${id||0})"><div class="grid g2"><div class="field"><label>Business</label><select name="business_unit_id" ${id?'disabled':''} required>${u.map(z=>`<option value="${z.id}" ${x?.business_unit_id==z.id?'selected':''}>${esc(z.name)}</option>`).join('')}</select></div><div class="field"><label>Type</label><select name="item_type"><option ${x?.item_type==='PRODUCT'?'selected':''}>PRODUCT</option><option ${x?.item_type==='SERVICE'?'selected':''}>SERVICE</option></select></div></div><div class="grid g2"><div class="field"><label>SKU</label><input name="sku" value="${esc(x?.sku||'')}" required></div><div class="field"><label>Name</label><input name="name" value="${esc(x?.name||'')}" required></div></div><div class="grid g3"><div class="field"><label>Category</label><input name="category" value="${esc(x?.category||'')}"></div><div class="field"><label>Supplier</label><input name="supplier" value="${esc(x?.supplier||'')}"></div><div class="field"><label>Unit</label><input name="unit" value="${esc(x?.unit||'pcs')}"></div></div><div class="grid g4">${id?'':`<div class="field"><label>Opening stock</label><input name="opening_stock" type="number" step="0.01" value="0"></div>`}<div class="field"><label>Reorder</label><input name="reorder_level" type="number" step="0.01" value="${x?.reorder_level||0}"></div><div class="field"><label>Cost/reference price</label><input name="cost_price" type="number" step="0.01" value="${x?.cost_price||0}"></div><div class="field"><label>Sell/reference price</label><input name="selling_price" type="number" step="0.01" value="${x?.selling_price||0}"></div></div><p class="muted">Reference prices are optional. POS and sales can use a different actual transaction price.</p><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">${id?'Update':'Save'}</button></div></form>`)}
async function saveProduct(e,id){e.preventDefault();const o=Object.fromEntries(new FormData(e.target));if(id)delete o.business_unit_id;try{await api(id?'/api/products/'+id:'/api/products',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});closeModal();toast(id?'Product/service updated':'Product/service added');loadView()}catch(x){toast(x.message)}}
async function deleteProduct(id){if(!confirm('Archive this product/service? Historical transactions will remain.'))return;try{await api('/api/products/'+id,{method:'DELETE'});toast('Product/service archived');loadView()}catch(x){toast(x.message)}}

async function finance(c){const [f,p]=await Promise.all([api('/api/finance'),api('/api/pnl')]);c.innerHTML=title('Finance & Profitability','Revenue, expenses, receipts, payment proof and business-unit P&L','<button class="btn primary" onclick="financeForm()">+ Finance entry</button>')+`<div class="grid g3">${p.map(x=>`<div class="card"><b>${esc(x.name)}</b><div class="grid g2" style="margin-top:12px"><div><small>Revenue</small><b>${money(x.sales)}</b></div><div><small>COGS</small><b>${money(x.cogs)}</b></div><div><small>Gross</small><b>${money(x.gross_profit)}</b></div><div><small>Net</small><b>${money(x.net_profit)}</b></div></div></div>`).join('')}</div><div class="card" style="margin-top:16px"><div class="table-wrap"><table class="table"><tr><th>Date</th><th>Business</th><th>Type</th><th>Category</th><th>Amount</th><th>Payment</th><th>Reference</th><th>Description</th><th>Actions</th></tr>${f.map(x=>`<tr><td>${x.created_at}</td><td>${esc(x.business_unit)}</td><td><span class="pill ${x.type==='Revenue'?'good':'warn'}">${x.type}</span></td><td>${esc(x.category)}</td><td>${money(x.amount)}</td><td>${esc(x.payment_method)}</td><td>${esc(x.reference)}</td><td>${esc(x.description)}</td><td><button class="btn small" onclick="financeEdit(${x.id})">Edit</button> <button class="btn small danger" onclick="voidFinance(${x.id})">Void</button></td></tr>`).join('')}</table></div></div>`}

async function restaurantPOS(){const [p,t]=await Promise.all([api('/api/products'),api('/api/restaurant/tables')]);const menu=p.filter(x=>x.business_unit==='MIMI Resturant');window._rItems=[];modal(`<h2>MIMI Resturant POS</h2><div class="pos-layout"><div><div class="grid g3"><div class="field"><label>Order type</label><select id="rType"><option>Dine-in</option><option>Takeaway</option><option>Delivery</option></select></div><div class="field"><label>Table</label><select id="rTable"><option value="">No table</option>${t.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Customer</label><input id="rCustomer"></div></div><div class="menu-grid">${menu.map(x=>`<button type="button" class="menu-item" onclick="addRItem(${x.id})"><b>${esc(x.name)}</b><div class="muted">${x.item_type} · ${money(x.selling_price)}</div></button>`).join('')}</div></div><div class="card"><h3>Order</h3><div id="rCart"></div><div class="field"><label>Payment</label><select id="rPayment"><option>Cash</option><option>Card</option><option>Bank</option><option>Credit</option></select></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveROrder()">Close & Pay</button></div></div></div>`);window._rProducts=menu;drawR()}
function addRItem(id){const p=window._rProducts.find(x=>x.id==id),x=window._rItems.find(x=>x.product_id==id);if(x)x.quantity++;else window._rItems.push({product_id:p.id,name:p.name,quantity:1,unit_price:p.selling_price});drawR()}
function drawR(){const e=document.getElementById('rCart');if(!e)return;e.innerHTML=window._rItems.length?window._rItems.map((x,i)=>`<div class="cart-row"><span>${esc(x.name)}</span><span><input style="width:55px" type="number" min="0.01" step="0.01" value="${x.quantity}" onchange="window._rItems[${i}].quantity=Number(this.value);drawR()"> × <input style="width:85px" type="number" min="0" step="0.01" value="${x.unit_price}" onchange="window._rItems[${i}].unit_price=Number(this.value);drawR()"> = <b>${money(x.quantity*x.unit_price)}</b> <button class="btn small" onclick="window._rItems.splice(${i},1);drawR()">×</button></span></div>`).join(''):'<span class="muted">Empty order</span>'}
async function saveROrder(){if(!window._rItems.length)return toast('Add menu items');try{const d=await api('/api/restaurant/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({table_id:document.getElementById('rTable').value,order_type:document.getElementById('rType').value,customer_name:document.getElementById('rCustomer').value,items:window._rItems})});const pay=document.getElementById('rPayment').value;await api('/api/restaurant/orders/'+d.id+'/close',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({payment_method:pay})});closeModal();toast('MIMI order closed and posted to sales/finance/inventory');loadView();printReceipt(d.id)}catch(x){toast(x.message)}}

async function kpiEdit(id){const rows=await api('/api/kpis'),u=await api('/api/users'),b=await api('/api/business-units'),x=rows.find(z=>z.id==id);modal(`<h2>Edit KPI</h2><form onsubmit="saveKPIEdit(event,${id})"><div class="field"><label>Name</label><input name="name" value="${esc(x.name)}" required></div><div class="grid g2"><div class="field"><label>Target</label><input name="target" type="number" value="${x.target}"></div><div class="field"><label>Actual</label><input name="actual" type="number" value="${x.actual}"></div></div><div class="grid g2"><div class="field"><label>User</label><select name="user_id"><option value="">Company / Unit</option>${u.map(z=>`<option value="${z.id}" ${x.user_id==z.id?'selected':''}>${esc(z.name)}</option>`).join('')}</select></div><div class="field"><label>Business</label><select name="business_unit_id"><option value="">Company</option>${b.map(z=>`<option value="${z.id}" ${x.business_unit_id==z.id?'selected':''}>${esc(z.name)}</option>`).join('')}</select></div></div><div class="field"><label>Period</label><input name="period" value="${esc(x.period||'Monthly')}"></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Update</button></div></form>`)}
async function saveKPIEdit(e,id){e.preventDefault();try{await api('/api/kpis/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});closeModal();toast('KPI updated');loadView()}catch(x){toast(x.message)}}
async function deleteKPI(id){if(!confirm('Delete this KPI?'))return;try{await api('/api/kpis/'+id,{method:'DELETE'});toast('KPI deleted');loadView()}catch(x){toast(x.message)}}
async function deleteDoc(id){if(!confirm('Delete this document?'))return;try{await api('/api/documents/'+id,{method:'DELETE'});toast('Document deleted');loadView()}catch(x){toast(x.message)}}
async function userEdit(id){const [rows,b]=await Promise.all([api('/api/users'),api('/api/business-units')]);const x=rows.find(z=>z.id==id);modal(`<h2>Edit user</h2><form onsubmit="saveUserEdit(event,${id})"><div class="field"><label>Name</label><input name="name" value="${esc(x.name)}" required></div><div class="field"><label>Email</label><input name="email" value="${esc(x.email)}" required></div><div class="grid g2"><div class="field"><label>Role</label><select name="role">${roles.map(r=>`<option ${x.role===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="field"><label>Business</label><select name="business_unit_id"><option value="">All / Company</option>${b.map(z=>`<option value="${z.id}" ${x.business_unit_id==z.id?'selected':''}>${esc(z.name)}</option>`).join('')}</select></div></div><div class="field"><label>New password (optional)</label><input name="password" type="password"></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Update</button></div></form>`)}
async function saveUserEdit(e,id){e.preventDefault();try{await api('/api/users/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});closeModal();toast('User updated');loadView()}catch(x){toast(x.message)}}
async function userDeactivate(id){if(!confirm('Deactivate this user?'))return;try{await api('/api/users/'+id,{method:'DELETE'});toast('User deactivated');loadView()}catch(x){toast(x.message)}}
boot();
</script></body></html>
