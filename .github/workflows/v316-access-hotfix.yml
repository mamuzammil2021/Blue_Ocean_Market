name: Apply V30.16 access-button hotfix

on:
  push:
    branches:
      - v30.16-access-button-hotfix
    paths:
      - .v316-hotfix-ready

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: v30.16-access-button-hotfix
          fetch-depth: 0
      - name: Patch strict-mode access handler declarations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/v316-client.js')
          s=p.read_text()
          marker="  window.__BLUE_OCEAN_V316_ACTIVE=true;\n"
          decl="  window.__BLUE_OCEAN_V316_ACTIVE=true;\n  // Hotfix: declare new access handlers before strict-mode assignments below.\n  var userAccessOpen,applyAccessTemplate,copyAccessDialog,copyAccessNow,saveAccessAssignments,saveAccessPermissions,saveAccessSpecial,saveAccessLimits;\n"
          if 'var userAccessOpen,applyAccessTemplate' not in s:
              if marker not in s:
                  raise SystemExit('Expected V30.16 marker not found')
              s=s.replace(marker,decl,1)
              p.write_text(s)
          PY
          node --check public/v316-client.js
          rm -f public/v316-access-preload.js .v316-hotfix-ready .github/workflows/v316-access-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Users & Access button handlers"
          git push origin HEAD:v30.16-access-button-hotfix
