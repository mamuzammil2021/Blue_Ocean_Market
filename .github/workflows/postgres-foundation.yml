name: PostgreSQL application acceptance
on:
  push:
    branches: ['migration/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: bom_test
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: bom_disposable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bom_test -d bom_disposable_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_SERVER_URL: postgres://bom_test:disposable_ci_password@localhost:5432/bom_disposable_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: >-
          node -e "process.env.CHROME_PATH=require('playwright').chromium.executablePath();
          const r=require('child_process').spawnSync(process.execPath,['qa/postgres/release.cjs'],{env:process.env,stdio:'inherit'});
          process.exit(r.status??1)"
