name: Apply V30.17 release patch

on:
  push:
    branches:
      - v30.17-access-control-hardening
    paths:
      - .v3017-ready

permissions:
  contents: write

jobs:
  apply-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: v30.17-access-control-hardening
          fetch-depth: 0
      - name: Apply exact V30.17 release patch
        shell: bash
        run: |
          set -euo pipefail
          cat .v3017-patch/chunk-* | base64 -d > /tmp/v3017.patch
          git apply --check /tmp/v3017.patch
          git apply /tmp/v3017.patch
          rm -rf .v3017-patch .v3017-ready .github/workflows/v3017-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Blue Ocean Market V30.17.0 - Access Control Hardening"
          git push origin HEAD:v30.17-access-control-hardening
