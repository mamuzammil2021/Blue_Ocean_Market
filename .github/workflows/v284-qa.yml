name: V28.4 QA

on:
  push:
    branches: [ "release/v28.4.0" ]
  pull_request:
    branches: [ "main" ]

jobs:
  qa-v284:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: V28.4 static and syntax QA
        run: npm run qa:v284
