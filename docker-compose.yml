services:
  blue-ocean:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      JWT_SECRET: change-this-secret-in-production
      ADMIN_EMAIL: admin@blueocean.local
      ADMIN_PASSWORD: Admin@123
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
